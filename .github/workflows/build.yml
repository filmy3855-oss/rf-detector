name: Build APK - FINAL FIX v4

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cek file wajib
        run: |
          echo "=== File di repo ==="
          ls -la
          echo ""
          echo "=== Cek .github/workflows ==="
          ls -la .github/workflows/ || echo "Folder .github/workflows TIDAK ADA!"
          echo ""
          if [ ! -f main.py ] && [ ! -f main_real_sensor.py ]; then
            echo "❌ ERROR: main.py tidak ditemukan! Upload main_real_sensor.py dan rename jadi main.py"
            exit 1
          fi
          if [ ! -f buildozer.spec ]; then
            echo "❌ ERROR: buildozer.spec tidak ditemukan! Upload buildozer.spec"
            exit 1
          fi
          echo "✅ File lengkap"

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libltdl-dev
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.33

      - name: Prepare main.py
        run: |
          if [ -f main_real_sensor.py ]; then
            cp main_real_sensor.py main.py
            echo "Pakai main_real_sensor.py sebagai main.py"
          fi
          ls -la *.py *.spec || true

      - name: Build APK
        run: |
          buildozer -v android debug
        env:
          ACCEPT_SDK_LICENSE_AGREEMENTS: "y"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RF-Detector-APK-SUCCESS
          path: bin/*.apk
          if-no-files-found: error
